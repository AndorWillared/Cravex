<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>RecompBreaker</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --line: #232a38;
    --text: #e6e9f0;
    --dim: #7c869b;
    --green: #34d399;
    --orange: #ff7a3d;
    --cols: 6;
    --rows: 5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  body {
    height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 12px);
    overflow: hidden;
  }

  /* HUD */
  header { padding: 14px 4px 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .count { font-size: 22px; font-weight: 700; letter-spacing: .2px; }
  .count b { font-size: 34px; color: var(--green); font-variant-numeric: tabular-nums; }
  .meta { font-size: 12px; color: var(--dim); text-align: right; line-height: 1.5; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 0 4px 10px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), #a7f3d0); transition: width .5s ease; }

  /* Raster */
  .field { flex: 1; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; }
  .grid {
    width: min(100cqw, calc(100cqh * var(--cols) / var(--rows)));
    aspect-ratio: var(--cols) / var(--rows);
    display: grid; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr);
    gap: 4px; padding: 6px; background: #07090d; border: 1px solid var(--line); border-radius: 14px;
  }
  .grid.shake { animation: shake .32s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translate(-1px, 0); } 20%, 80% { transform: translate(2px, 1px); }
    30%, 50%, 70% { transform: translate(-4px, -1px); } 40%, 60% { transform: translate(4px, 1px); }
  }
  .block {
    position: relative; border-radius: 6px;
    background:
      radial-gradient(circle at 25% 20%, rgba(255,255,255,.14), transparent 55%),
      linear-gradient(145deg, hsl(222 14% calc(var(--l) * 1%)), hsl(222 16% calc(var(--l) * 1% - 8%)));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -3px 0 rgba(0,0,0,.35);
  }
  .block::after { /* Erzader */
    content: ""; position: absolute; width: 18%; height: 18%; left: var(--ox); top: var(--oy);
    background: var(--ore); border-radius: 50%; opacity: .75; filter: blur(.5px);
  }
  .block.broken { visibility: hidden; }
  .block.hit { animation: hit .22s ease-out; }
  @keyframes hit { 0% { filter: brightness(2.2); transform: scale(1.08); } 100% { filter: none; transform: none; } }
  .block.back { animation: back .45s cubic-bezier(.2,1.4,.4,1) backwards; animation-delay: var(--d); }
  @keyframes back { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Tasten */
  .pad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 14px; }
  .btn {
    --c: var(--green);
    position: relative; overflow: hidden; min-height: 84px; border-radius: 16px;
    border: 2px solid color-mix(in srgb, var(--c) 55%, transparent);
    background: var(--panel); color: var(--text); font: inherit; text-align: left; padding: 12px 14px;
    touch-action: none; cursor: pointer;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
    box-shadow: 0 0 18px -8px var(--c);
    transition: transform .18s ease, background .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .btn.wide { grid-column: 1 / -1; min-height: 76px; }
  .btn .fill {
    position: absolute; inset: 0; transform-origin: bottom; transform: scaleY(var(--p, 0));
    background: linear-gradient(0deg, color-mix(in srgb, var(--c) 70%, transparent), color-mix(in srgb, var(--c) 25%, transparent));
    pointer-events: none;
  }
  .btn .t, .btn .s, .btn .ck { position: relative; pointer-events: none; }
  .btn .t { font-size: 17px; font-weight: 700; }
  .btn .s { font-size: 12px; color: var(--dim); }
  .btn .ck { position: absolute; right: 14px; top: 50%; translate: 0 -50%; font-size: 26px; opacity: 0; }
  .btn.holding { box-shadow: 0 0 30px -4px var(--c); border-color: var(--c); }
  .btn.done {
    background: linear-gradient(145deg, var(--c), color-mix(in srgb, var(--c) 55%, #000));
    border-color: var(--c); color: #06130d; box-shadow: 0 0 22px -6px var(--c); cursor: default;
  }
  .btn.done .s { color: rgba(0,0,0,.6); }
  .btn.done .ck { opacity: 1; }
  .btn.pop { animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
  .hint { text-align: center; font-size: 11px; color: var(--dim); padding-top: 10px; display: flex; justify-content: center; gap: 14px; }
  .hint a { color: var(--dim); text-decoration: underline; }

  .toast {
    position: fixed; left: 50%; top: 22%; translate: -50% 0; background: rgba(20,24,33,.95);
    border: 1px solid var(--green); color: var(--green); padding: 14px 22px; border-radius: 14px;
    font-weight: 700; font-size: 18px; opacity: 0; pointer-events: none; transition: opacity .3s, translate .3s; z-index: 5;
  }
  .toast.show { opacity: 1; translate: -50% -10px; }
  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

  @media (prefers-reduced-motion: reduce) {
    .grid.shake, .block.hit, .block.back, .btn.pop { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="count">Noch <b id="left">–</b> Blöcke</div>
    <div class="meta" id="meta"></div>
  </header>
  <div class="bar"><i id="bar"></i></div>

  <div class="field"><div class="grid" id="grid"></div></div>

  <div class="pad" id="pad"></div>
  <div class="hint"><span>Taste gedrückt halten</span><a href="#" id="export">Export</a></div>

  <div class="toast" id="toast"></div>
  <canvas id="fx"></canvas>

<script>
'use strict';

/* ================= Config ================= */
const CFG = {
  cols: 6,
  rows: 5,
  holdMs: 1200,          // Haltezeit fuer den Payoff
  cutoffHour: 4,         // Tageswechsel um 04:00
  buttons: [
    { id: 'bowl',   label: 'Bowl',           sub: '10:30',     color: '#34d399' },
    { id: 'lunch',  label: 'Mittagessen',    sub: 'schnell',   color: '#34d399' },
    { id: 'dinner', label: 'Abendessen',     sub: '',          color: '#34d399' },
    { id: 'boss',   label: 'Abend-Boss',     sub: 'ab 20 Uhr', color: '#34d399' },
    { id: 'sport',  label: 'Gym / Spinning', sub: 'Sport',     color: '#ff7a3d', wide: true },
  ],
};
const N = CFG.cols * CFG.rows;
const KEY = 'recompbreaker.v1';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= State ================= */
function freshState() { return { v: 1, total: 0, round: 1, broken: [], days: {}, log: [] }; }
function load() {
  try { return Object.assign(freshState(), JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch { return freshState(); }
}
const state = load();
if (state.broken.length >= N) { state.broken = []; state.round++; }
const save = () => localStorage.setItem(KEY, JSON.stringify(state));
navigator.storage?.persist?.();

const pad2 = (n) => String(n).padStart(2, '0');
function dayKey() {
  const override = new URLSearchParams(location.search).get('day'); // Test: ?day=2026-11-10
  if (override) return override;
  const d = new Date(Date.now() - CFG.cutoffHour * 3600e3);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
const todayDone = () => state.days[dayKey()] || {};

/* ================= UI aufbauen ================= */
const $ = (id) => document.getElementById(id);
const gridEl = $('grid'), padEl = $('pad');
document.documentElement.style.setProperty('--cols', CFG.cols);
document.documentElement.style.setProperty('--rows', CFG.rows);

const hash = (i) => { let h = (i + 1) * 2654435761 >>> 0; h ^= h >>> 15; return h >>> 0; };
const ORES = ['#34d399', '#fbbf24', '#22d3ee', '#a78bfa'];
const blocks = [];
for (let i = 0; i < N; i++) {
  const h = hash(i), b = document.createElement('div');
  b.className = 'block';
  b.style.setProperty('--l', 24 + (h % 10));
  b.style.setProperty('--ore', ORES[(h >> 4) % ORES.length]);
  b.style.setProperty('--ox', 10 + ((h >> 8) % 55) + '%');
  b.style.setProperty('--oy', 10 + ((h >> 14) % 55) + '%');
  gridEl.appendChild(b); blocks.push(b);
}

const btnEls = {};
for (const cfg of CFG.buttons) {
  const el = document.createElement('button');
  el.className = 'btn' + (cfg.wide ? ' wide' : '');
  el.style.setProperty('--c', cfg.color);
  el.innerHTML = `<span class="fill"></span><span class="t">${cfg.label}</span><span class="s">${cfg.sub}</span><span class="ck">✓</span>`;
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  el.addEventListener('pointerdown', (e) => startHold(e, el, cfg));
  el.addEventListener('pointerup', cancelHold);
  el.addEventListener('pointercancel', cancelHold);
  padEl.appendChild(el); btnEls[cfg.id] = el;
}

function render() {
  const done = todayDone();
  for (const cfg of CFG.buttons) {
    btnEls[cfg.id].classList.toggle('done', !!done[cfg.id]);
  }
  blocks.forEach((b, i) => b.classList.toggle('broken', state.broken.includes(i)));
  updateHud();
}
function updateHud() {
  const left = N - state.broken.length;
  $('left').textContent = left;
  $('bar').style.width = (state.broken.length / N * 100) + '%';
  const d = Object.keys(todayDone()).length;
  $('meta').innerHTML = `Runde ${state.round} · gesamt ${state.total}<br>heute ${d}/${CFG.buttons.length}`;
}

/* ================= Haptik ================= */
const vib = (p) => { try { navigator.vibrate?.(p); } catch {} };

/* ================= Long-Press ================= */
let hold = null;
function startHold(e, el, cfg) {
  if (hold || todayDone()[cfg.id]) return;
  try { el.setPointerCapture(e.pointerId); } catch {}
  hold = { el, cfg, t0: performance.now(), step: -1 };
  el.classList.add('holding');
  requestAnimationFrame(tickHold);
}
function resetVisual(el) {
  el.classList.remove('holding');
  el.style.setProperty('--p', 0);
  el.style.transform = '';
}
function tickHold(now) {
  if (!hold) return;
  const p = Math.min(1, (now - hold.t0) / CFG.holdMs);
  const { el } = hold;
  el.style.setProperty('--p', p);
  const amp = REDUCED ? 0 : p * p * 3.2;
  el.style.transform = `scale(${1 - 0.05 * p}) translate(${(Math.random() - .5) * 2 * amp}px, ${(Math.random() - .5) * 2 * amp}px)`;
  const step = Math.floor(p * 6);
  if (step !== hold.step && p < 1) { hold.step = step; vib(12 + step * 14); }
  if (p >= 1) return complete();
  requestAnimationFrame(tickHold);
}
function cancelHold() {
  if (!hold) return;
  resetVisual(hold.el); hold = null; vib(0);
}

/* ================= Payoff ================= */
function complete() {
  const { el, cfg } = hold; hold = null;
  resetVisual(el);
  vib([40, 30, 140]);

  const dk = dayKey(), now = Date.now();
  (state.days[dk] ||= {})[cfg.id] = now;
  state.log.push({ ts: now, day: dk, btn: cfg.id });
  state.total++;

  const free = [...blocks.keys()].filter((i) => !state.broken.includes(i));
  const idx = free[Math.floor(Math.random() * free.length)];
  state.broken.push(idx);
  save();

  el.classList.add('done', 'pop');
  el.addEventListener('animationend', () => el.classList.remove('pop'), { once: true });
  fireProjectile(el, blocks[idx], cfg.color, () => impact(idx, cfg.color));
}
function impact(idx, color) {
  const b = blocks[idx], r = b.getBoundingClientRect();
  b.classList.add('hit');
  setTimeout(() => b.classList.add('broken'), 90);
  burst(r.left + r.width / 2, r.top + r.height / 2, color);
  if (!REDUCED) { gridEl.classList.remove('shake'); void gridEl.offsetWidth; gridEl.classList.add('shake'); }
  vib(30);
  updateHud();
  if (state.broken.length >= N) setTimeout(refill, 900);
}
function refill() {
  if (state.broken.length < N) return;
  state.broken = []; state.round++; save();
  blocks.forEach((b, i) => { b.classList.remove('broken', 'hit'); b.style.setProperty('--d', (i * 20) + 'ms'); b.classList.remove('back'); void b.offsetWidth; b.classList.add('back'); });
  updateHud(); vib([30, 40, 30, 40, 90]);
  const t = $('toast'); t.textContent = `Runde ${state.round - 1} geschafft! ⛏`; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ================= Effekte (Canvas) ================= */
const cv = $('fx'), ctx = cv.getContext('2d');
const parts = [], shots = [];
let running = false, last = 0;
function resize() { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', resize); resize();

function fireProjectile(fromEl, toEl, color, done) {
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2;
  const x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
  shots.push({ x0, y0, x1, y1, cx: (x0 + x1) / 2 + (Math.random() - .5) * 80, cy: Math.min(y0, y1) - 60, t: 0, dur: 0.45, color, done, trail: [] });
  kick();
}
function burst(x, y, color) {
  const n = REDUCED ? 8 : 26, cols = [color, '#fbbf24', '#cbd5e1', '#64748b'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 260;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 90, life: 0, max: .5 + Math.random() * .4, size: 2 + Math.random() * 4, color: cols[i % cols.length] });
  }
  kick();
}
function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); } }
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i]; s.t += dt / s.dur;
    const u = Math.min(1, s.t), e = u * u, m = 1 - e;
    const x = m * m * s.x0 + 2 * m * e * s.cx + e * e * s.x1;
    const y = m * m * s.y0 + 2 * m * e * s.cy + e * e * s.y1;
    s.trail.push({ x, y }); if (s.trail.length > 12) s.trail.shift();
    s.trail.forEach((p, k) => {
      const f = (k + 1) / s.trail.length;
      ctx.globalAlpha = f * .6; ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2 + 6 * f, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1; ctx.shadowColor = s.color; ctx.shadowBlur = 16; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    if (u >= 1) { shots.splice(i, 1); s.done(); }
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  if (shots.length || parts.length) requestAnimationFrame(loop); else running = false;
}

/* ================= Export, Tageswechsel, SW ================= */
$('export').addEventListener('click', (e) => {
  e.preventDefault();
  const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), config: CFG, state }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `recompbreaker-${dayKey()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
let shownDay = dayKey();
const checkDay = () => { if (dayKey() !== shownDay) { shownDay = dayKey(); render(); } };
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
setInterval(checkDay, 60000);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
</script>
</body>
</html>
