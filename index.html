<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15130f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>Spectrack</title>
</head>
<body>
  <main id="home">
    <button class="hud" id="hud" aria-label="Open stats">
      <span class="kpi"><b id="k-month">–</b><small id="k-month-label">great this month</small></span>
      <span class="kpi"><b id="k-total">–</b><small>great overall</small></span>
      <span class="kpi"><b id="k-streak">–</b><small>day streak</small></span>
      <span class="chev" aria-hidden="true">›</span>
    </button>

    <div class="chips" id="filters" role="group" aria-label="Metric filter"></div>

    <section class="cal">
      <div class="weekdays"><span></span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="grid-scroll" id="grid-scroll"><div class="grid" id="grid"></div></div>
    </section>

    <section class="pad" id="pad"></section>

    <footer class="foot">
      <button type="button" id="export">Export</button>
      <button type="button" id="import">Import</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </footer>
  </main>

  <section id="stats" class="page" hidden>
    <header class="page-head">
      <button type="button" class="back" data-close aria-label="Back">‹</button>
      <h1>Stats</h1>
    </header>
    <div class="page-body" id="stats-body"></div>
  </section>

  <div class="overlay" id="detail" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="sheet-head">
        <h2 id="detail-title"></h2>
        <button type="button" class="done" data-close>Close</button>
      </div>
      <div id="detail-body"></div>
    </div>
  </div>

  <div class="overlay" id="editor" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="editor-title">
      <div class="sheet-head">
        <h2 id="editor-title"></h2>
        <button type="button" class="done" data-close>Done</button>
      </div>
      <div id="editor-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
